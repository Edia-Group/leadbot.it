x-leadbot-common: &leadbot-common
  restart: always
  depends_on:
    leadbot-redis:
      condition: service_healthy
    leadbot-db:
      condition: service_healthy
  networks:
    - leadbot-network
  env_file: .env
  environment:
    REDIS_URL: redis://leadbot-redis:6379

services:
  leadbot-db:
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=leadbot
      - POSTGRES_PASSWORD=leadbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leadbot-network

  leadbot-redis:
    image: redis:alpine
    restart: always
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis-data:/data
    networks:
      - leadbot-network

  leadbot-builder:
    <<: *leadbot-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SCOPE: "@leadbot/builder"
        APP_DIR: builder
    ports:
      - "8080:3000"

  leadbot-viewer:
    <<: *leadbot-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SCOPE: viewer
        APP_DIR: viewer
    ports:
      - "8081:3000"

  leadbot-landing:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.landing
      args:
        SCOPE: landing-page
    networks:
      - leadbot-network
    env_file: .env
    ports:
      - "8082:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  leadbot-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
