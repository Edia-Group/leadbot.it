name: Build and Push Docker images

# Deleghiamo la build delle immagini frontend a GitHub Actions (l'host Dokploy
# condiviso andava in OOM buildando bun/turbo). Le immagini vengono pubblicate
# su registry.edia.cloud; su Dokploy le app sono configurate come "Docker"
# (pull dell'immagine) invece di "build from GitHub".
#
# Trigger manuale dalla tab "Actions". L'input "image" sceglie quale buildare.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Quale immagine buildare"
        type: choice
        default: all
        options:
          - all
          - builder
          - viewer
          - landing

env:
  REGISTRY: registry.edia.cloud

jobs:
  # Costruisce la matrice di build a partire dall'input: tutte le immagini
  # oppure solo quella selezionata. (Il context `matrix` non e' utilizzabile
  # nell'`if` a livello di job, quindi filtriamo qui.)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set
        run: |
          all='[
            {"name":"builder","image":"leadbot-builder","dockerfile":"Dockerfile","build-args":"SCOPE=@leadbot/builder\nAPP_DIR=builder"},
            {"name":"viewer","image":"leadbot-viewer","dockerfile":"Dockerfile","build-args":"SCOPE=viewer\nAPP_DIR=viewer"},
            {"name":"landing","image":"leadbot-landing","dockerfile":"Dockerfile.landing","build-args":""}
          ]'
          sel='${{ github.event.inputs.image }}'
          if [ "$sel" = "all" ]; then
            matrix=$(echo "$all" | jq -c '{include: .}')
          else
            matrix=$(echo "$all" | jq -c --arg s "$sel" '{include: [.[] | select(.name==$s)]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    # Usa l'environment "prod" così il job ha accesso ai suoi secrets
    # (REGISTRY_USERNAME / REGISTRY_PASSWORD).
    environment: prod
    # Ogni immagine su un runner separato (RAM dedicata, niente OOM tra build
    # concorrenti come succedeva su Dokploy).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Lo stage finale "release" è quello che Dokploy usava (dockerBuildStage=release).
          target: release
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          # Cache per-immagine così le build non si sovrascrivono a vicenda.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
